<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>減重日誌小幫手</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242424;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:18px 14px 40px;max-width:720px;margin-inline:auto}.hero{padding:22px 20px;background:#eaf2ff;border-radius:22px;margin-bottom:16px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#4f5d73;line-height:1.5}.card{background:white;border-radius:18px;padding:18px;margin:13px 0;box-shadow:0 2px 12px #1720330a}.card h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field:last-child{margin-bottom:0}label{font-size:13px;color:#5b6472;font-weight:600}input,textarea{width:100%;font:inherit;border:1px solid #d9dee7;border-radius:11px;padding:12px;background:#fff;color:#222;min-width:0}input:focus,textarea:focus{outline:2px solid #9bbcff;border-color:#6f9cff}textarea{resize:vertical;min-height:74px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{border:0;border-radius:12px;padding:13px 12px;font:inherit;font-weight:650;cursor:pointer}.primary{background:#245fce;color:white}.secondary{background:#edf1f7;color:#253047}.danger{background:#fff0f0;color:#a92b2b}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f6f8fb;border-radius:12px;padding:12px}.stat small{display:block;color:#6a7280;margin-bottom:4px}.stat strong{font-size:21px}.muted{font-size:12px;color:#747c89;line-height:1.5}.entry{border:1px solid #e3e7ee;border-radius:13px;padding:13px;margin-top:10px}.entryhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.entryhead strong{font-size:15px}.entry p{white-space:pre-wrap;line-height:1.5;margin:8px 0 0;font-size:13px}.entry button{padding:8px 10px;font-size:12px}.notice{font-size:13px;color:#3f5e44;background:#eff8ef;padding:10px 12px;border-radius:10px;margin-top:10px;display:none}.pill{display:inline-block;background:#edf3ff;color:#315ca8;border-radius:99px;padding:4px 8px;font-size:12px;margin-right:4px}
@media(max-width:380px){.grid{grid-template-columns:1fr}.btns{grid-template-columns:1fr}.hero h1{font-size:22px}}
</style></head>
<body>
<div class="hero"><h1>📒 減重日誌小幫手</h1><p>每天填一次，幫你整理早晚體重、三餐和手錶消耗。紀錄會保存在這台裝置的瀏覽器裡。</p></div>
<div class="card"><h2>今天的紀錄</h2>
<div class="field"><label for="date">日期</label><input id="date" type="date"></div>
<div class="grid"><div class="field"><label for="morning">早上體重（kg）</label><input id="morning" type="number" step="0.1" inputmode="decimal" placeholder="例如 78.7"></div><div class="field"><label for="evening">晚上體重（kg）</label><input id="evening" type="number" step="0.1" inputmode="decimal" placeholder="例如 79.1"></div></div>
<div class="field"><label for="breakfast">早餐</label><textarea id="breakfast" placeholder="例如：火腿吐司、阿華田；沒吃可填睡覺沒吃"></textarea></div>
<div class="field"><label for="lunch">午餐</label><textarea id="lunch" placeholder="例如：雞絲、生菜、洋蔥"></textarea></div>
<div class="field"><label for="dinner">晚餐</label><textarea id="dinner" placeholder="例如：白飯、雞肉、青菜"></textarea></div>
<div class="grid"><div class="field"><label for="dynamic">動態消耗（kcal）</label><input id="dynamic" type="number" inputmode="numeric" placeholder="例如 766"></div><div class="field"><label for="static">靜態消耗（kcal）</label><input id="static" type="number" inputmode="numeric" placeholder="例如 1882"></div></div>
<div class="field"><label for="notes">備註（選填）</label><textarea id="notes" placeholder="例如：月經、運動、身體狀況"></textarea></div>
<div class="btns"><button class="primary" id="save">儲存今天紀錄</button><button class="secondary" id="generate">整理成可貼給 ChatGPT 的文字</button></div><div id="notice" class="notice"></div>
</div>
<div class="card"><h2>📊 體重概況</h2><div class="stats"><div class="stat"><small>最近一筆早上體重</small><strong id="latest">—</strong></div><div class="stat"><small>比第一筆早上體重</small><strong id="change">—</strong></div><div class="stat"><small>已記錄天數</small><strong id="count">0 天</strong></div><div class="stat"><small>最近一筆早晚差</small><strong id="gap">—</strong></div></div><p class="muted">體重會受水分、食物和排便影響，建議比較早上體重趨勢，不要只看單日變化。</p></div>
<div class="card"><h2>🗂️ 已儲存紀錄</h2><p class="muted">可修改或刪除單日紀錄，也可以匯出 CSV 備份。若按鈕沒有反應，請點分享並選「在 Safari 中開啟」；聊天視窗的預覽模式可能不支援網頁互動。</p><div class="btns"><button class="secondary" id="export">匯出 CSV</button><button class="secondary" id="copyAll">複製全部紀錄文字</button></div><div id="entries"></div><div class="btns"><button class="danger" id="clear">清除所有紀錄</button></div></div>
<script>
const $=id=>document.getElementById(id);const KEY='weightDiaryHelper_v1';let records=[];
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){try{records=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){records=[]} $('date').value=localDate();render()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));render();return true}catch(e){render();notice('紀錄已暫存在目前頁面，但瀏覽器不允許儲存。請用 Safari 開啟此網頁，並匯出 CSV 備份。');return false}}
function val(id){return $(id).value.trim()}
function readForm(){return {date:val('date'),morning:val('morning'),evening:val('evening'),breakfast:val('breakfast'),lunch:val('lunch'),dinner:val('dinner'),dynamic:val('dynamic'),static:val('static'),notes:val('notes')}}
function fill(r){for(const k of ['date','morning','evening','breakfast','lunch','dinner','dynamic','static','notes'])$(k).value=r[k]??'';window.scrollTo({top:0,behavior:'smooth'})}
function format(r){const lines=[`${r.date||'日期未填'} 減重紀錄`];if(r.morning)lines.push(`早上 ${r.morning} kg`);if(r.evening)lines.push(`晚上 ${r.evening} kg`);lines.push(`早餐 ${r.breakfast||'未填'}`,`午餐 ${r.lunch||'未填'}`,`晚餐 ${r.dinner||'未填'}`);if(r.dynamic)lines.push(`動態 ${r.dynamic} kcal`);if(r.static)lines.push(`靜態 ${r.static} kcal`);if(r.notes)lines.push(`備註 ${r.notes}`);return lines.join('\n')}
function notice(msg){$('notice').textContent=msg;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',3000)}
$('save').addEventListener('click',()=>{try{const r=readForm();if(!r.date){notice('請先選擇日期');return}const i=records.findIndex(x=>x.date===r.date);if(i>=0)records[i]=r;else records.push(r);records.sort((a,b)=>a.date.localeCompare(b.date));const ok=persist();if(ok)notice(i>=0?'已更新這一天的紀錄！':'已儲存今天的紀錄！')}catch(e){notice('儲存失敗：請改用 Safari 開啟，或重新載入網頁後再試。')}});
$('generate').onclick=async()=>{const t=format(readForm());try{await navigator.clipboard.writeText(t);notice('已複製！回到 ChatGPT 貼上就可以了。')}catch{prompt('複製以下文字，再貼到 ChatGPT：',t)}};
function render(){records.sort((a,b)=>b.date.localeCompare(a.date));$('count').textContent=`${records.length} 天`;const chronological=[...records].sort((a,b)=>a.date.localeCompare(b.date));const first=chronological.find(x=>x.morning!==''&&x.morning!=null),last=records.find(x=>x.morning!==''&&x.morning!=null);$('latest').textContent=last?`${last.morning} kg`:'—';if(first&&last){const n=Number(last.morning)-Number(first.morning);$('change').textContent=`${n>0?'+':''}${n.toFixed(1)} kg`}else $('change').textContent='—';const lr=records[0];$('gap').textContent=lr&&lr.morning!==''&&lr.evening!==''?`${(Number(lr.evening)-Number(lr.morning)>0?'+':'')+(Number(lr.evening)-Number(lr.morning)).toFixed(1)} kg`:'—';$('entries').innerHTML='';if(!records.length){$('entries').innerHTML='<p class="muted">目前還沒有儲存紀錄。先填上方表單，按「儲存今天紀錄」即可。</p>';return}for(const r of records){const d=document.createElement('div');d.className='entry';const head=document.createElement('div');head.className='entryhead';const title=document.createElement('strong');title.textContent=r.date;const actions=document.createElement('div');const edit=document.createElement('button');edit.className='secondary';edit.textContent='載入修改';edit.onclick=()=>fill(r);const del=document.createElement('button');del.className='danger';del.textContent='刪除';del.style.marginLeft='6px';del.onclick=()=>{if(confirm(`確定刪除 ${r.date} 的紀錄？`)){records=records.filter(x=>x.date!==r.date);persist()}};actions.append(edit,del);head.append(title,actions);const p=document.createElement('p');p.textContent=[r.morning?`早 ${r.morning} kg`:'',r.evening?`晚 ${r.evening} kg`:'',r.breakfast?`早餐：${r.breakfast}`:'',r.lunch?`午餐：${r.lunch}`:'',r.dinner?`晚餐：${r.dinner}`:'',r.dynamic?`動態 ${r.dynamic}`:'',r.static?`靜態 ${r.static}`:''].filter(Boolean).join(' · ');d.append(head,p);$('entries').append(d)}}
$('export').onclick=()=>{if(!records.length){notice('目前沒有紀錄可以匯出');return}const cols=['date','morning','evening','breakfast','lunch','dinner','dynamic','static','notes'];const csv=[cols.join(','),...records.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='減重日誌.csv';a.click();URL.revokeObjectURL(url)};
$('copyAll').onclick=async()=>{if(!records.length){notice('目前沒有紀錄可以複製');return}const t=[...records].sort((a,b)=>a.date.localeCompare(b.date)).map(format).join('\n\n');try{await navigator.clipboard.writeText(t);notice('全部紀錄已複製！')}catch{prompt('複製全部紀錄：',t)}};
$('clear').onclick=()=>{if(confirm('確定清除全部紀錄？這個動作無法復原。')){records=[];persist();notice('已清除全部紀錄')}};
load();
</script></body></html>
